name: Build Android (Capacitor)

# Builds the official Capacitor version of the app.
# - Every run produces an installable debug APK (Actions tab -> Artifacts).
# - If you add signing secrets (see below), it also produces a signed
#   release AAB for Google Play.
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     base64 of your release keystore (.jks / .keystore)
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias, e.g. basel-moanes
#   KEY_PASSWORD        key password

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www)
        # capacitor.config.json ships with webDir "." which the Capacitor
        # CLI rejects, so stage the static site into www/ and point
        # webDir at it for this build only.
        run: |
          mkdir -p /tmp/www
          rsync -a \
            --exclude node_modules --exclude android --exclude ios \
            --exclude .git --exclude .github --exclude www \
            --exclude package.json --exclude package-lock.json \
            --exclude capacitor.config.json --exclude .gitignore \
            ./ /tmp/www/
          rm -rf www && mv /tmp/www www
          jq '.webDir = "www"' capacitor.config.json > capacitor.config.tmp
          mv capacitor.config.tmp capacitor.config.json
          cat capacitor.config.json

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: basel-moanes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release AAB (only if signing secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set - skipping release AAB."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cd android && ./gradlew bundleRelease && cd ..
          jarsigner -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: basel-moanes-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          # 'warn' (not 'error'): without signing secrets there is no AAB,
          # and the run should still finish green with just the debug APK.
          if-no-files-found: warn
