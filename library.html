  <form id="add-form" class="band" style="margin-top:22px">
    <div>
      <h2>أضف رابط يوتيوب</h2>
      <div class="form-row" style="margin-top:12px">

        <input name="url" required placeholder="رابط يوتيوب" />

        <label class="chip on"><input type="radio" name="kind" value="tilawa" checked hidden> تلاوة</label>

      </div>
      <p id="add-note" class="muted"></p>
    </div>
    <button class="btn btn-brand" type="submit">أضف إلى المكتبة</button>
  </form>
</section>
